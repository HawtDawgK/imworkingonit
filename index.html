<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pref. List</title>
  <link rel="icon" type="image/x-icon" href="https://cdn.discordapp.com/attachments/1019893441779466250/1019893463384334386/PL.png">
  <link rel="stylesheet" href="kinklist.css">
</head>
<body>

  <div class="widthWrapper">
    <header class="header-bar">
      <button id="Edit" title="Edit Kinks"></button>
      <h1>Pref. List</h1>
      <select id="listType">
        <option value="classic">Simple</option>
        <option value="detailed">Detailed</option>
        <option value="plsno">Everything</option>
      </select>

      <div class="legend" id="Legend">
        <div><span data-color="#cdcdcd" data-level="Not Entered" class="choice notEntered"></span> <span class="legend-text">Not Entered</span></div>
        <div><span data-color="#00da49" data-level="Fetish" class="choice fetish"></span> <span class="legend-text">Fetish</span></div>
        <div><span data-color="#c72900" data-level="Favorite" class="choice favorite"></span> <span class="legend-text">Favorite</span></div>
        <div><span data-color="#880088" data-level="Like" class="choice like"></span> <span class="legend-text">Like</span></div>
        <div><span data-color="#141414" data-level="Indifferent" class="choice indifferent"></span> <span class="legend-text">Indifferent</span></div>
        <div><span data-color="#0204db" data-level="Not Really" class="choice notReally"></span> <span class="legend-text">Not Really</span></div>
        <div><span data-color="#2999f3" data-level="Negotiable" class="choice negotiable"></span> <span class="legend-text">Negotiable</span></div>
        <div><span data-color="#77f4f4" data-level="Hard Stop" class="choice hardStop"></span> <span class="legend-text">Hard Stop</span></div>
      </div>

      <div id="ExportWrapper">
        <input type="text" id="URL" readonly>
        <button id="Export">Export</button>
        <div id="Loading">Loading</div>
      </div>
      <button id="StartBtn" title="Start Guided Entry"></button>
    </header>

    <main id="InputList"></main>
  </div>

  <!-- Edit Text Modal -->
  <div id="EditOverlay" class="overlay">
    <textarea id="Kinks">
#Section
(Title)
* Option 1
? Description
* Option 2
? Description
    </textarea>
    <button id="KinksOK">Accept</button>
  </div>

  <!-- Guided Entry Modal -->
  <div id="InputOverlay" class="overlay">
    <div class="widthWrapper">
      <div id="InputPrevious"></div>
      <div id="InputCurrent">
        <h2 id="InputCategory"></h2>
        <h3 id="InputField"></h3>
        <button class="closePopup" id="CloseInputOverlay">&times;</button>
        <div id="InputValues"></div>
      </div>
      <div id="InputNext"></div>
    </div>
  </div>

  <!-- Description Modal -->
  <div id="DescriptionOverlay" class="overlay">
    <div id="Description"></div>
  </div>

  <script src="kinklist.js"></script>
</body>
</html>
